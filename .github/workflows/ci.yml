name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ./ci.db
      SESSION_SECRET: ci-only-not-a-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Migrations apply cleanly on an empty database
        run: npx drizzle-kit migrate

      - name: Seed runs without error
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Smoke test (every route, every demo role)
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          BASE=http://localhost:3000 bash scripts/smoke.sh
          kill $SERVER_PID

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t nuvra:ci .

      - name: Boot with an empty volume (migrations + first admin at startup)
        run: |
          docker volume create nuvra-ci-data
          docker run -d --name nuvra -p 3000:3000 -v nuvra-ci-data:/data \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -e ADMIN_EMAIL=admin@ci.local -e ADMIN_PASSWORD='ci-only-passphrase-1' \
            -e CRON_SECRET=ci-secret nuvra:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          echo "--- container log ---"; docker logs nuvra
          echo "--- health ---"; curl -sf http://localhost:3000/api/health | tee health.json; echo
          grep -q '"db":"ok"' health.json
          grep -q '"cronProtected":true' health.json
          echo "--- public pages ---"
          for p in / /pricing /academy /login /register; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000$p); echo "$p $code"; [ "$code" = 200 ]
          done
          echo "--- env-provisioned admin can sign in ---"
          curl -sf -H 'content-type: application/json' \
            -d '{"email":"admin@ci.local","password":"ci-only-passphrase-1"}' \
            http://localhost:3000/api/auth/login | tee login.json; echo
          grep -q '"role":"ADMIN"' login.json
          echo "--- cron endpoint is protected ---"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/cron/process)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-cron-secret: ci-secret' http://localhost:3000/api/cron/process)" = 200 ]

      - name: Data survives a restart (persistent volume)
        run: |
          docker restart nuvra
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          curl -sf -H 'content-type: application/json' \
            -d '{"email":"admin@ci.local","password":"ci-only-passphrase-1"}' \
            http://localhost:3000/api/auth/login | grep -q '"role":"ADMIN"'
          docker logs nuvra 2>&1 | grep -c 'administrator created' | grep -qx 1   # not re-created
